name: Browser tests

# Every push and every pull request, on every branch.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The job id and name are both "e2e", so it can be picked as a required status check.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # Playwright exits non-zero when any test fails, which fails this job.
      - name: Browser tests
        run: npm run test:e2e
        env:
          TZ: America/Chicago
      - name: Keep the Playwright report when a browser test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
