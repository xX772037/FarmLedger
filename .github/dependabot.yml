# Weekly update checks for the npm packages in package.json and the actions used in .github/workflows.
# (Replaces GitHub's starter file, which had no package type filled in and the wrong file name, so it did nothing.)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # Stay on actions/upload-artifact v4 (the e2e workflow's report upload); still take its v4 fixes.
      - dependency-name: actions/upload-artifact
        update-types: [version-update:semver-major]
